# The checks that gate every push and every release, in one place so that a
# release cannot be built from a tree that CI would have rejected.
name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `rustup show` reads rust-toolchain.toml and installs what it names,
      # including the rustfmt and clippy components. Naming a version here as
      # well would give the repository two answers to the same question.
      - name: Install the pinned toolchain
        run: |
          rustup show
          cargo --version

      # Caching is for the check jobs only. The release build deliberately runs
      # without a cache, so a published artifact never depends on what a
      # previous run happened to leave behind.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets --all-features -- -D warnings
      - run: cargo test --release --workspace --all-features

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - run: python -m pip install --upgrade 'ruff>=0.9'
      - run: ruff check python
      - run: ruff format --check python
