# Builds and publishes a release, by hand, from a commit that already carries
# the version it will ship under.
#
# The version is never written by this workflow. It is read from Cargo.toml and
# the dispatch input has to agree with it, so the artifact corresponds to a
# reviewed commit and two runs of the same commit produce the same bytes.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, exactly as Cargo.toml declares it (e.g. 4.8.0+rs2.1)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only. Leave checked until the run is known good.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Releases are serialised and never cancelled. A half-finished one leaves a tag
# behind that the guard job would then refuse to reuse.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can reject the release before a single crate is compiled.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      public: ${{ steps.check.outputs.public }}
      major: ${{ steps.check.outputs.major }}
      next_major: ${{ steps.check.outputs.next_major }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - run: python -m pip install --upgrade packaging

      - name: Check the version keeps the drop-in property
        id: check
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python .github/scripts/check_release_version.py

  checks:
    needs: guard
    uses: ./.github/workflows/checks.yml

  build:
    needs: [guard, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      # Pinned so the wheel's recorded timestamps do not depend on when it was
      # built. Same value as the manual build in the README.
      SOURCE_DATE_EPOCH: '315532800'
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Built inside the manylinux_2_28 image rather than on the runner, so the
      # glibc floor is a decision (2.28: RHEL 8, Debian 10) instead of whatever
      # the runner image happens to ship. The CPU floor is separate and comes
      # from .cargo/config.toml; the two are not related.
      #
      # No cache here. A published artifact should depend on the commit and
      # nothing else.
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --interpreter python3.13 --out dist
          manylinux: '2_28'
          docker-options: -e SOURCE_DATE_EPOCH

      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          docker-options: -e SOURCE_DATE_EPOCH

      # The wheel only loads on x86-64-v3, so the smoke test needs a runner that
      # clears that bar. GitHub's hosted images do today; fail loudly rather
      # than skip if that ever stops being true, because an unexercised wheel is
      # the one thing this workflow exists to prevent.
      - name: Require an x86-64-v3 runner
        run: |
          missing=""
          for flag in avx2 bmi2 fma; do
            grep -qw "$flag" /proc/cpuinfo || missing="$missing $flag"
          done
          if [ -n "$missing" ]; then
            echo "::error::runner CPU lacks:$missing -- cannot smoke-test the wheel here"
            exit 1
          fi

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet --no-deps dist/*.whl
          /tmp/smoke/bin/python .github/scripts/smoke_test.py "$VERSION"

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz | tee SHA256SUMS

      # Ties each file to this workflow, this commit and this run. Verified by
      # `gh attestation verify`. Skipped on a dry run because an attestation is
      # a permanent public record.
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Keep the build output for inspection
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ needs.guard.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Compose the release notes
        if: ${{ !inputs.dry_run }}
        env:
          PUBLIC: ${{ needs.guard.outputs.public }}
          MAJOR: ${{ needs.guard.outputs.major }}
          NEXT_MAJOR: ${{ needs.guard.outputs.next_major }}
        run: |
          sed -e "s|@VERSION@|$VERSION|g" \
              -e "s|@TAG@|$TAG|g" \
              -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              -e "s|@PUBLIC@|$PUBLIC|g" \
              -e "s|@MAJOR@|$MAJOR|g" \
              -e "s|@NEXT_MAJOR@|$NEXT_MAJOR|g" \
            .github/release-notes.md.in > /tmp/release-notes.md
          cat /tmp/release-notes.md

      # `gh release create` creates the tag at the built commit, so there is no
      # window in which a tag exists without a release behind it.
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest \
            dist/*
